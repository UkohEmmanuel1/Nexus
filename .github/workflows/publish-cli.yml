name: Publish Vonk CLI

on:
  push:
    branches: [main]
    paths:
      - 'packages/python-cli/**'
      - 'packages/npm-cli/**'
      - '.github/workflows/publish-cli.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish after validation
        type: choice
        required: true
        default: build-only
        options: [build-only, npm, pypi, both]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CLI and build tools
        run: python -m pip install ./packages/python-cli pytest build twine
      - name: Python CLI and MCP tests
        run: python -m pytest tests/test_assistant_cli.py tests/test_workspace.py tests/test_providers.py -q
      - name: npm CLI and MCP tests
        run: npm --prefix packages/npm-cli test
      - name: Installed Python entry point
        run: vonk models huggingface
      - name: Build Python distributions
        if: matrix.os == 'ubuntu-latest'
        run: python -m build --outdir artifacts/python ./packages/python-cli
      - name: Validate Python metadata
        if: matrix.os == 'ubuntu-latest'
        run: python -m twine check artifacts/python/*
      - name: Build npm tarball
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p artifacts/npm
          npm pack ./packages/npm-cli --pack-destination artifacts/npm
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vonk-cli-distributions
          path: artifacts/

  pypi:
    needs: validate
    if: inputs.target == 'pypi' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vonk-cli-distributions
          path: artifacts
      - name: Publish through the configured PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/python/

  npm:
    needs: validate
    if: inputs.target == 'npm' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vonk-cli-distributions
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish with the configured registry credential
        run: npm publish artifacts/npm/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
