[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vonk-ai-terminal"
version = "0.3.0"
description = "Lightweight multi-provider Vonk coding assistant CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/UkohEmmanuel1/Vonk"
Repository = "https://github.com/UkohEmmanuel1/Vonk"
Issues = "https://github.com/UkohEmmanuel1/Vonk/issues"

[project.scripts]
vonk = "nexus_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_terminal*"]
