[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-terminal"
version = "0.1.0"
description = "Lightweight multi-provider Nexus coding assistant CLI"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "fastapi>=0.109"]

[project.scripts]
nexus-ai = "nexus_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_terminal*"]
