[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vonk-ai-terminal"
version = "0.2.0"
description = "Lightweight multi-provider Vonk coding assistant CLI"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
vonk = "nexus_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_terminal*"]
