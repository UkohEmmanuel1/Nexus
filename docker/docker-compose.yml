services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEXUS_ADMIN_KEY: ${NEXUS_ADMIN_KEY:?Set NEXUS_ADMIN_KEY}
      NEXUS_API_KEY: ${NEXUS_API_KEY:?Set NEXUS_API_KEY}
      NEXUS_MODEL_REPO: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      NEXUS_MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
      NEXUS_MODEL_REVISION: 91cad51170dc346986eccefdc2dd33a9da36ead9
    volumes:
      - nexus-data:/var/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
volumes:
  nexus-data:
