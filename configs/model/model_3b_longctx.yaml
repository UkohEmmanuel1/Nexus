model:
  dim: 3200
  n_layers: 26
  n_heads: 32
  n_kv_heads: 8
  ffn_mult: 2.6667
  vocab_size: 128000
  max_seq_len: 4096
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  hidden_dropout: 0.0
  attention_dropout: 0.0
  moe:
    enabled: true
    num_experts: 8
    top_k: 2
    capacity_factor: 1.25
    aux_loss_coef: 0.01
    z_loss_coef: 0.001
  init_std: 0.02
  use_flash_attn: true
  gradient_checkpointing: true
  dtype: bfloat16
  long_context:
    enabled: true
    max_seq_len: 1048576
    rope_scaling:
      type: yarn
      factor: 256.0
      original_max_seq_len: 4096
      beta_fast: 32
      beta_slow: 1
    sliding_window_size: 4096
    global_attention_every_n: 128
    num_global_heads: 4
    compress_ratio: 64
    memory_tokens: 64
    chunk_size: 4096
  thinking:
    enabled: true
    thinking_token_budget: 2048
    thinking_token_id: 128000
    end_think_token_id: 128001
    answer_token_id: 128002
    end_answer_token_id: 128003
    deep_think_enabled: true
    deep_think_hypotheses: 3
