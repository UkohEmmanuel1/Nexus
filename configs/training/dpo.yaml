defaults:
  - model: model_3b
  - override hydra/job_logging: colorlog

training:
  lr: 1.0e-6
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  max_steps: 3000
  warmup_steps: 50
  batch_size: 2
  grad_accum_steps: 4
  max_grad_norm: 1.0
  dtype: bfloat16
  log_interval: 10
  save_interval: 500
  eval_interval: 200
  output_dir: ./checkpoints/dpo
  wandb: false

dpo:
  beta: 0.1
  label_smoothing: 0.0
  loss_type: sigmoid
